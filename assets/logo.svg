<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="28" y1="28" x2="228" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="40" y1="60" x2="216" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="64" y1="154" x2="192" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded icon tile with ~10% margin -->
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#bgGrad)" stroke="url(#pillBorder)" stroke-width="5"/>
  <!-- Floating Dynamic Capsule silhouette -->
  <rect x="46" y="72" width="164" height="56" rx="28" fill="#1E293B" stroke="url(#pillBorder)" stroke-width="3.5"/>
  <!-- Live glowing status orb -->
  <circle cx="76" cy="100" r="14" fill="#34D399" fill-opacity="0.22"/>
  <circle cx="76" cy="100" r="8" fill="#34D399"/>
  <!-- Title & subtitle bars inside capsule -->
  <rect x="100" y="90" width="66" height="8" rx="4" fill="#F8FAFC"/>
  <rect x="100" y="104" width="44" height="6" rx="3" fill="#94A3B8"/>
  <!-- Percentage pill -->
  <rect x="174" y="91" width="24" height="18" rx="9" fill="#0EA5E9" fill-opacity="0.25"/>
  <circle cx="186" cy="100" r="4" fill="#38BDF8"/>
  <!-- Checklist progress card below -->
  <rect x="54" y="142" width="148" height="42" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <rect x="70" y="156" width="116" height="8" rx="4" fill="#1E293B"/>
  <rect x="70" y="156" width="84" height="8" rx="4" fill="url(#barGrad)"/>
  <circle cx="178" cy="172" r="4" fill="#34D399"/>
  <rect x="70" y="170" width="56" height="4" rx="2" fill="#64748B"/>
</svg>
